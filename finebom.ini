; FineBOM configuration. UTF-8; relative paths start beside this INI.
[plugin]
template = templates/BOM.ots
; Empty: use the project directory supplied by the adapter.
output_dir =
output_subdir = Docs
filename_pattern = <projectname>v<revision>bom<datetime>.ods
filename_datetime_format = %d.%m.%Y_%H-%M
open_result = false
; Optional INI with [environment], useful for explicit offline replay.
environment_file =

[bom]
part_types = Normal,Tip
asm_field = ASM
asm_true = Y,YES,TRUE
; Group by the exact original Value unless explicitly enabled.
group_after_replacements = false

[sort]
refdes_order = A,C,R,L,D,DA,DD,D*,VD,VT,*

[format]
; \s represents a space.
refdes_separator = ,\s
template_rows = auto
timestamp_format = %Y%m%d %H:%M

[environment_options]
prefix = <
suffix = >
; Values are requested through ctx.environment(), not read independently.
process_environment = true
process_names = root_proj,projectname,revision,author
; keep leaves unresolved tokens visible; error rejects the output.
missing = keep

[environment]
; Explicit fallbacks. Add your own values, for example:
; projectname = ExampleProject
; revision = 1
; Company = Example Company
; Priority: XML > adapter environment > environment_file > finebom.project.ini > this section.

[print]
page_setup = template
header_footer = bom
; Only used with page_setup=override.
landscape = false
fit_to_width = false
set_bom_print_range = true

[replace:01]
enabled = false
fields = Manufacturer
mode = exact
find = TI
replace = Texas Instruments
ignore_case = true

[replace:02]
enabled = false
fields = Case
mode = exact
find = SM0603
replace = 0603
ignore_case = true
